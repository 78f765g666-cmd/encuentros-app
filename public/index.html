<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encuentros · perfiles por eventos</title>
<style>
:root{color-scheme:dark;--bg:#0c0c0e;--card:#151518;--tx:#f5efe4;--mut:#8d877b;--ac:#ffb21f;--ac2:#241d10;--bd:#232327;--ok:#ffd23f;--hot:#ff4d6d;--grad:linear-gradient(135deg,#ffd23f,#ff8a1f 55%,#ff4d6d);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
#app{max-width:480px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:6px 0 4px}h2{font-size:17px;font-weight:600;margin:26px 0 10px}
p{margin:0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:0;border-radius:14px;padding:16px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}
.btn{background:linear-gradient(135deg,#ffc933,#ff8a1f);color:#1a1205;border:0;border-radius:12px;padding:12px 16px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn.sm{padding:8px 12px;font-size:14px}.btn.ghost{background:var(--ac2);color:var(--ac)}.btn.full{width:100%}.btn.danger{background:#ff4d6d;color:#fff}
.btn[disabled]{opacity:.5}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:16px inherit;font-family:inherit}
.av{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#ffc933,#ff8a1f);color:#1a1205;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex:none}
.av.s{width:42px;height:42px;font-size:17px;background:var(--ac2);color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--ac2);color:var(--ac);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.chip.x{background:var(--ac);color:#1a1205}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc933,#ff8a1f)}
.stats{display:flex;gap:10px}.stats div{flex:1;text-align:center}.stats b{display:block;font-size:24px;font-weight:600;color:var(--ac)}
.ev{font-size:28px}.tag-ok{color:var(--ok);font-weight:700;font-size:14px}
.pct{font-weight:800;color:var(--ac);font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 12px inherit;font-family:inherit;padding:6px;cursor:pointer}
nav button span{display:block;font-size:22px}nav button.on{color:var(--ac)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:9}
#ov.show{display:flex}
.vf{width:200px;height:200px;border:3px solid #fff;border-radius:20px;position:relative;overflow:hidden}
.vf:after{content:"";position:absolute;left:0;right:0;height:3px;background:#7cf5b8;animation:sc .9s linear infinite}
@keyframes sc{0%{top:0}100%{top:100%}}
#toast{position:fixed;left:16px;right:16px;bottom:96px;max-width:448px;margin:0 auto;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
#toast.show{opacity:1}
.empty{text-align:center;padding:30px 10px}.empty .ev{font-size:44px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:13px inherit;font-family:inherit;cursor:pointer;margin-top:24px}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:11;padding:16px}
#sh.show{display:flex}
#sh .box{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:440px;text-align:center;margin-bottom:env(safe-area-inset-bottom,0px)}
.ph{width:100%;border-radius:12px;margin-top:10px;display:block;max-height:320px;object-fit:cover;cursor:zoom-in}
.tier{font-size:13px;color:var(--mut);margin:-6px 0 10px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:8px}
nav button{font-size:11px}
.seg{display:flex;gap:6px;background:var(--ac2);padding:4px;border-radius:14px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--ac);font:600 14px inherit;font-family:inherit;padding:10px 6px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--ac);color:#1a1205}
button.chip{border:0;cursor:pointer;font-family:inherit}
.qr{background:#fff;border-radius:14px;padding:12px;display:inline-block;margin:10px 0}
.qr svg{display:block;width:200px;height:200px}
.cover{width:100%;height:130px;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px}
.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none}
.upl{display:flex;align-items:center;gap:12px}
input:focus{outline:none;border-color:var(--ac)}
nav button svg{display:block;margin:0 auto 3px}
.gl{color:var(--ac);font-family:system-ui,"Apple Symbols","Noto Sans Symbols2","Segoe UI Symbol",sans-serif;font-style:normal;font-weight:400}
.btn .gl,.chip.x .gl{color:inherit}
.btn{background:var(--grad);border-radius:99px;padding:13px 20px;font-weight:700;box-shadow:0 6px 18px rgba(255,90,60,.22)}
.btn.sm{padding:8px 14px}
.btn.ghost{box-shadow:none}
.card{border-radius:20px}
h1{font-size:32px;font-weight:800;letter-spacing:-.03em}
.av{background:var(--grad)}
.chip.x,.mg.me,.seg button.on{background:var(--grad)}
.bar i{background:var(--grad)}
.pct{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.lt{color:var(--hot)}
h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav button.on{color:var(--hot)}
.avi{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:none}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bg{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;opacity:.45}
.bg.on{opacity:1;box-shadow:inset 0 0 0 1px rgba(255,178,31,.35)}
.bgi{width:40px;height:40px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bd);color:var(--mut)}
.bg.on .bgi,.bgi.on2{background:var(--grad);color:#1a1205}
.bgi.on2{margin:0;width:34px;height:34px;font-size:16px;flex:none}
.bg b{display:block;font-size:12px}
.bg span{display:block;font-size:10.5px;color:var(--mut);margin-top:2px;line-height:1.25}
.newb{margin-top:14px;padding:12px;border-radius:14px;background:var(--ac2)}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:12}
.cf i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tg{width:46px;height:28px;border-radius:99px;background:var(--bd);border:0;position:relative;cursor:pointer;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:left .2s}
.tg.on{background:var(--grad)}
.tg.on:after{left:21px;background:#1a1205}
.mp{background:var(--card);border-radius:20px;padding:8px;margin-top:12px}
.mp svg{display:block}
.lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--mut)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.top{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 8px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bellb{position:relative;background:var(--card);border:0;color:var(--ac);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bellb i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:99px;background:var(--hot);color:#fff;font:700 11px/18px system-ui,sans-serif;text-align:center;font-style:normal;padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bd);flex:none}
.dot.on{background:var(--hot)}
.stars{display:flex;justify-content:center;gap:4px}
.st{background:none;border:0;font-size:32px;line-height:1;color:var(--bd);cursor:pointer;padding:0 2px}
.st.on{color:var(--ac)}
.ice{margin-top:12px}
.ice .chip{display:block;width:100%;text-align:left;margin-top:6px;white-space:normal;border-radius:14px;padding:9px 12px;font-weight:500;font-size:13px}
.tl{position:relative;margin-top:10px;padding-left:24px}
.tl:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--ac),var(--hot));opacity:.5}
.tli{position:relative}
.tli i{position:absolute;left:-24px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px var(--bg)}
.msgs .mg.me{background:var(--grad)}
.card{box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.btn{box-shadow:0 8px 24px rgba(255,77,109,.35)}
.btn.ghost{box-shadow:none}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(255,138,31,.55))}
body{background:radial-gradient(640px 420px at 100% -5%,rgba(255,77,109,.34),transparent 70%),radial-gradient(560px 380px at 0% 0%,rgba(255,178,31,.24),transparent 70%),var(--bg);background-attachment:fixed}
nav{background:rgba(12,12,14,.94)}
#sh .ph{max-height:70vh;object-fit:contain;cursor:default}
#sh .box{max-height:88vh;overflow:auto}
.msgs{height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-top:12px}
.mg{max-width:80%;background:var(--ac2);color:var(--tx);padding:8px 12px;border-radius:14px 14px 14px 4px;align-self:flex-start;font-size:15px}
.mg.me{align-self:flex-end;background:var(--ac);color:#1a1205;border-radius:14px 14px 4px 14px}
.mg small{display:block;font-size:11px;font-weight:700;color:var(--ac);margin-bottom:2px}
.sys{align-self:center;text-align:center;color:var(--mut);font-size:12px;margin:4px 0}

/* ESTILOS DE CÁMARA REAL Y ESCÁNER */
.cam-card{background:var(--card);border-radius:20px;padding:14px;border:1px solid var(--bd);text-align:center;margin-top:10px}
.cam-view{position:relative;width:100%;aspect-ratio:1/1;max-width:320px;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.cam-video{width:100%;height:100%;object-fit:cover}
.cam-reticle{position:absolute;inset:14%;border:2px solid rgba(255,178,31,.6);border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none;transition:border-color .2s,box-shadow .2s}
.cam-reticle.found{border-color:var(--ok);box-shadow:0 0 0 9999px rgba(0,0,0,.25),0 0 30px rgba(255,210,63,.85)}
.cam-laser{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#ffb21f 50%,transparent);box-shadow:0 0 10px #ffb21f;animation:camLaser 2s ease-in-out infinite alternate}
@keyframes camLaser{0%{top:6%}100%{top:94%}}
.cam-tools{display:flex;gap:8px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.cam-status{color:var(--mut);font-size:13px;margin:10px 0 4px}
.cam-err{padding:30px 16px;text-align:center}
.cam-err b{display:block;margin-bottom:6px;color:#ff6b6b}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"><div>
<button data-t="perfil"><span>👤</span>Perfil</button>
<button data-t="escanear"><span>📷</span>Escanear</button>
<button data-t="planes"><span>🗓️</span>Planes</button>
<button data-t="afines"><span>🤝</span>Afines</button>
</div></nav>
<div id="ov"><div class="vf"></div><p style="margin-top:18px">Escaneando QR…</p></div>
<div id="toast"></div>
<div id="sh"></div>
<input type="file" id="fi" accept="image/*" hidden>
<input type="file" id="qrf" accept="image/*" hidden>

<!-- Lector y generador de códigos QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const EVENTS=[
{id:'startup',n:'Meetup de Startups',e:'🚀',d:'Madrid · octubre',t:['emprendimiento','tecnología','networking']},
{id:'indie',n:'Festival Indie',e:'🎸',d:'Madrid · septiembre',t:['música','conciertos','indie']},
{id:'run',n:'Carrera popular 10K',e:'🏃',d:'Sierra de Madrid · octubre',t:['running','deporte','salud']},
{id:'hack',n:'Hackathon Cañada',e:'💻',d:'Villanueva de la Cañada · noviembre',t:['tecnología','programación','IA']},
{id:'libro',n:'Feria del Libro',e:'📚',d:'Madrid · junio',t:['lectura','literatura','cultura']},
{id:'food',n:'Mercado gastronómico',e:'🍜',d:'Madrid · noviembre',t:['cocina','gastronomía','viajes']}];
const PEOPLE=[
{n:'Lucía',a:27,ev:['startup','hack']},{n:'Marcos',a:31,ev:['indie','food','libro']},
{n:'Irene',a:24,ev:['run','food']},{n:'Álvaro',a:35,ev:['startup','hack','run']},
{n:'Sara',a:29,ev:['libro','indie']},{n:'Diego',a:22,ev:['hack','indie']},
{n:'Carmen',a:41,ev:['food','libro','run']},{n:'Pablo',a:26,ev:['startup','food']}];
const ev=id=>EVENTS.find(x=>x.id===id)||((S&&S.pub)||[]).find(x=>x.id===id);
let S=load(),tab='perfil';
function load(){try{return JSON.parse(localStorage.getItem('qrp')||'null')||{u:null,ev:[]}}catch(e){return{u:null,ev:[]}}}
function save(){try{localStorage.setItem('qrp',JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function vec(ids){const v={};ids.forEach(i=>{const item=ev(i);if(item&&item.t)item.t.forEach(t=>v[t]=(v[t]||0)+1)});return v}
function cos(a,b){let d=0,x=0,y=0;for(const k in a){x+=a[k]*a[k];if(b[k])d+=a[k]*b[k]}for(const k in b)y+=b[k]*b[k];return x&&y?d/Math.sqrt(x*y):0}
function matches(){const me=vec(S.ev);return PEOPLE.map(p=>{
const sh=p.ev.filter(i=>S.ev.includes(i)),pv=vec(p.ev),tags=Object.keys(me).filter(k=>pv[k]);
return{p,sh,tags,s:cos(me,pv)}}).filter(m=>m.s>0&&!isBlk(m.p.n)).sort((a,b)=>b.s-a.s)}
function toast(m){const t=document.getElementById('toast');t.textContent=m.replace(RX,'').trim();t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}

// Sonido de confirmación al escanear QR (Web Audio API)
function playBeep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.connect(g);g.connect(ctx.destination);
    osc.type='sine';
    osc.frequency.setValueAtTime(587,ctx.currentTime);
    osc.frequency.setValueAtTime(880,ctx.currentTime+0.09);
    g.gain.setValueAtTime(0.25,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.28);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+0.28);
    if(navigator.vibrate)navigator.vibrate([70,40,70]);
  }catch(e){}
}

function scan(id,old){
if(S.ev.includes(id)){toast('Ya has registrado tu asistencia a este evento.');return}
if((S.pub||[]).some(e=>e.id===id)&&!okCode(qrCode(id,old?slot()-6:slot()))){toast('Este QR ha caducado. Escanea el código que se muestra ahora en el evento.');return}
playBeep();
document.getElementById('ov').classList.add('show');
setTimeout(()=>{document.getElementById('ov').classList.remove('show');
const bk=Object.keys(vec(S.ev)),before=bk.length;S.ev.push(id);((S.sc||(S.sc={}))[id]||(S.sc[id]=[])).push('yo');(S.ets||(S.ets={}))[id]=Date.now();seed(id);save();
const add=Object.keys(vec(S.ev)).length-before;
toast('Perfil actualizado: '+ev(id).n+(add?' · '+add+' intereses nuevos':''));const nt=Object.keys(vec(S.ev)).filter(k=>!bk.includes(k)),nb=chk();render();celebrate(id,nt,nb);nb.forEach(b=>notify('evt','Insignia desbloqueada: '+b.n,b.d,{tab:'perfil'},1));planNotif()},950)}

function sheet(h){const s=document.getElementById('sh');s.innerHTML=h;if(!h)qid=null;if(h)skin(s);s.classList.toggle('show',!!h)}
document.getElementById('sh').addEventListener('click',e=>{if(e.target.id==='sh')sheet('')});
function askPhoto(id){sheet(`<div class="box"><div class="ev">${ev(id).e}</div><h2 style="margin:6px 0">¡${esc(ev(id).n)} añadido!</h2><p class="mut">¿Quieres guardar una foto como recuerdo de este evento?</p><button class="btn full" style="margin-top:14px" id="up">📷 Subir foto</button><button class="btn full ghost" style="margin-top:8px" id="no">Ahora no</button></div>`);
document.getElementById('up').onclick=()=>pick(id);document.getElementById('no').onclick=()=>sheet('')}
function pick(id){const f=document.getElementById('fi');f.value='';f.onchange=()=>{const file=f.files[0];if(file)shrink(file,id)};f.click()}
function shrink(file,id){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=720,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
(S.ph||(S.ph={}))[id]=c.toDataURL('image/jpeg',.72);
let ok=true;try{localStorage.setItem('qrp',JSON.stringify(S))}catch(e){ok=false}
sheet('');tab='perfil';render();const nb=chk();if(nb.length)bdToast(nb);else toast(ok?'Foto guardada como recuerdo':'Foto añadida, pero no cabe guardarla en este dispositivo')};im.onerror=()=>toast('No se pudo leer la imagen');im.src=r.result};r.readAsDataURL(file)}
function view(src){sheet(`<div class="box" style="padding:8px"><img class="ph" style="margin:0" src="${src}" alt="Recuerdo del evento"></div>`)}

// REQUISITO APPLE OBLIGATORIO: ELIMINACIÓN DE CUENTA Y DATOS
function deleteAccountConfirm(){
  sheet(`<div class="box" style="text-align:left">
    <h2 style="margin:0 0 8px;color:#ff4d6d">⚠️ Eliminar cuenta y datos</h2>
    <p style="font-size:14px;line-height:1.5;margin-bottom:14px">Esta acción borrará permanentemente de tu dispositivo tu perfil, tu edad, los registros de eventos, las fotos de recuerdos y todos los chats guardados. <b>Esta acción no se puede deshacer.</b></p>
    <button class="btn full danger" id="btnDoDelete">Sí, eliminar mi cuenta definitivamente</button>
    <button class="btn full ghost" style="margin-top:8px" data-close="1">Cancelar</button>
  </div>`);
  document.getElementById('btnDoDelete').onclick=()=>{
    stopCamera();
    localStorage.removeItem('qrp');
    S={u:null,ev:[]};
    sheet('');
    tab='perfil';
    render();
    toast('Tu cuenta y todos tus datos han sido eliminados.');
  };
}

// POLÍTICA DE PRIVACIDAD PARA APPLE
function privacyPolicySheet(){
  sheet(`<div class="box" style="text-align:left;max-height:80vh;overflow-y:auto">
    <h2 style="margin:0 0 10px">Política de Privacidad</h2>
    <p class="mut" style="font-size:13px;line-height:1.5">Encuentros está diseñada para respetar al máximo tu privacidad:</p>
    <ul style="font-size:13px;color:var(--tx);padding-left:18px;margin:10px 0;line-height:1.6">
      <li><b>Uso de la Cámara:</b> Se utiliza en tiempo real únicamente para detectar y escanear códigos QR de eventos. No se graban, guardan ni transmiten imágenes de tu cámara a servidores externos.</li>
      <li><b>Datos de Perfil:</b> Tu nombre y edad se usan exclusivamente para calcular la afinidad de intereses en eventos.</li>
      <li><b>Modo Invisible:</b> Puedes activarlo para no ser visible para otros asistentes en la sección de Afines.</li>

const WIN=30000,slot=()=>Math.floor(Date.now()/WIN);

let mediaStream=null;
let scanActive=false;
let camFacing='environment'; // 'environment' (trasera) o 'user' (frontal)
let scanLock=false;

function isNativeBarcodeSupported(){
  return 'BarcodeDetector' in window;
}

async function startCamera(){
  stopCamera();
  const box=document.getElementById('camViewArea');
  const video=document.getElementById('camVideo');
  const stText=document.getElementById('camStatusText');
  if(!video||!box)return;
  
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    renderCamError('Tu navegador o dispositivo no soporta acceso directo a la cámara.');
    return;
  }
  
  if(stText)stText.textContent='Iniciando cámara...';
  
  try{
    const constraints={
      video:{
        facingMode:camFacing,
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    };
    mediaStream=await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject=mediaStream;
    video.setAttribute('playsinline','true');
    await video.play();
    scanActive=true;
    if(stText)stText.textContent='Apunta la cámara al código QR del evento';
    requestAnimationFrame(scanLoop);
  }catch(err){
    console.error('Error accediendo a cámara:',err);
    if(err.name==='NotAllowedError'||err.name==='PermissionDeniedError'){
      renderCamError('Permiso de cámara denegado. Para escanear, permite el acceso a la cámara en los ajustes de tu iPhone o navegador.');
    }else if(err.name==='NotFoundError'||err.name==='DevicesNotFoundError'){
      renderCamError('No se encontró ninguna cámara disponible en este dispositivo.');
    }else{
      renderCamError('No se pudo iniciar la cámara: '+err.message);
    }
  }
}

function stopCamera(){
  scanActive=false;
  if(mediaStream){
    mediaStream.getTracks().forEach(track=>track.stop());
    mediaStream=null;
  }
  const video=document.getElementById('camVideo');
  if(video)video.srcObject=null;
}

function renderCamError(msg){
  const box=document.getElementById('camViewArea');
  if(!box)return;
  box.innerHTML=`<div class="cam-err">
    <div style="font-size:36px;margin-bottom:8px">📷</div>
    <b>Acceso a la cámara necesario</b>
    <p class="mut">${esc(msg)}</p>
    <button class="btn sm" style="margin-top:12px" id="btnRetryCam">Reintentar</button>
  </div>`;
  const btn=document.getElementById('btnRetryCam');
  if(btn)btn.onclick=()=>render();
}

async function scanLoop(){
  if(!scanActive)return;
  const video=document.getElementById('camVideo');
  const reticle=document.getElementById('camReticle');
  
  if(video&&video.readyState===video.HAVE_ENOUGH_DATA&&!scanLock){
    let rawText=null;
    
    // Método 1: BarcodeDetector nativo (iOS 17+ y Chrome)
    if(isNativeBarcodeSupported()){
      try{
        const detector=new BarcodeDetector({formats:['qr_code']});
        const codes=await detector.detect(video);
        if(codes.length>0&&codes[0].rawValue){
          rawText=codes[0].rawValue;
        }
      }catch(e){}
    }
    
    // Método 2: Fallback jsQR
    if(!rawText&&window.jsQR){
      let canvas=document.getElementById('camCanvas');
      if(!canvas){
        canvas=document.createElement('canvas');
        canvas.id='camCanvas';
        canvas.style.display='none';
        document.body.appendChild(canvas);
      }
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'dontInvert'});
      if(code&&code.data){
        rawText=code.data;
      }
    }
    
    if(rawText){
      handleDetectedQR(rawText,reticle);
    }
  }
  
  if(scanActive){
    requestAnimationFrame(scanLoop);
  }
}

function handleDetectedQR(raw,reticle){
  if(scanLock)return;
  scanLock=true;
  if(reticle)reticle.classList.add('found');
  
  // Procesar formato Encuentros: "ENCUENTROS:id:slot:hash" o "id"
  let matchedId=null;
  const parts=raw.split(':');
  if(parts[0]==='ENCUENTROS'&&parts.length===4){
    const targetId=parts[1];
    if(okCode(raw)||EVENTS.some(x=>x.id===targetId)||((S.pub||[]).some(x=>x.id===targetId))){
      matchedId=targetId;
    }
  }else{
    const targetId=raw.trim();
    if(EVENTS.some(x=>x.id===targetId)||((S.pub||[]).some(x=>x.id===targetId))){
      matchedId=targetId;
    }
  }
  
  if(matchedId){
    stopCamera();
    scan(matchedId);
    setTimeout(()=>{scanLock=false},2000);
  }else{
    toast('Código detectado pero no coincide con ningún evento válido');
    setTimeout(()=>{
      if(reticle)reticle.classList.remove('found');
      scanLock=false;
    },1800);
  }
}

function decodeFromImageFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=async ()=>{
      let rawText=null;
      if(isNativeBarcodeSupported()){
        try{
          const detector=new BarcodeDetector({formats:['qr_code']});
          const codes=await detector.detect(img);
          if(codes.length>0&&codes[0].rawValue)rawText=codes[0].rawValue;
        }catch(e){}
      }
      if(!rawText&&window.jsQR){
        const canvas=document.createElement('canvas');
        canvas.width=img.width;
        canvas.height=img.height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0);
        const imgData=ctx.getImageData(0,0,img.width,img.height);
        const code=jsQR(imgData.data,imgData.width,imgData.height);
        if(code)rawText=code.data;
      }
      if(rawText){
        handleDetectedQR(rawText,null);
      }else{
        toast('No se encontró ningún código QR nítido en esa imagen.');
      }
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

`<div class="empty"><div class="ev">🔍</div><p><b>Aún no hay coincidencias</b></p><p class="mut">Escanea el QR de algún evento para descubrir a personas con perfiles parecidos.</p></div>`}
