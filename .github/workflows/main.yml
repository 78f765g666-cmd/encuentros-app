name: Compilar iOS en la Nube

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar App iOS en Mac Cloud
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm install

      - name: 4. Sincronizar Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: 5. Compilar proyecto en Xcode Cloud
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO

      - name: 6. Guardar archivo compilado
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-compilada
          path: ios/App/build/Release-iphoneos/
          retention-days: 14
